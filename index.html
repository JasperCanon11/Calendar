
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyCalendar</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon">✦</span>
        <h1>MyCalendar</h1>
      </div>
      <button id="todayBtn" class="btn btn-secondary">Today</button>
    </header>

    <main class="layout">
      <section class="calendar-panel">
        <div class="calendar-heading">
          <div>
            <p class="eyebrow">YOUR SCHEDULE</p>
            <h2 id="monthTitle">Loading...</h2>
          </div>
          <div class="month-controls">
            <button id="prevBtn" class="icon-btn" aria-label="Previous month">←</button>
            <button id="nextBtn" class="icon-btn" aria-label="Next month">→</button>
          </div>
        </div>

        <div class="calendar-grid weekdays">
          <div>Sun</div><div>Mon</div><div>Tue</div>
          <div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>
        <div id="calendarGrid" class="calendar-grid"></div>
      </section>

      <aside class="events-panel">
        <p class="eyebrow">STAY ORGANIZED</p>
        <h2>My Events</h2>
        <p id="selectedDate" class="selected-date"></p>

        <form id="eventForm">
          <label for="eventTitle">Event name</label>
          <input id="eventTitle" type="text"
            placeholder=" " required maxlength="100">

          <label for="eventTime">Time</label>
          <input id="eventTime" type="time">

          <button class="btn btn-primary" type="submit">
            + Add Event
          </button>
        </form>

        <div class="event-list-heading">
          <h3>Selected day</h3>
          <span id="eventCount" class="count">0</span>
        </div>
        <ul id="eventList" class="event-list"></ul>
        <p class="storage-note">✦ Your events are saved in this browser.</p>
      </aside>
    </main>
  </div>
</body>
</html>
